<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset password | Nietzsche AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --bg-canvas:      #0a0b0d;
            --bg-surface-2:   #15171d;
            --bg-surface-3:   #1b1e25;
            --border:         #23262e;
            --border-strong:  #33373f;
            --text-primary:   #eef0f3;
            --text-secondary: #9aa0ab;
            --text-muted:     #666c77;
            --accent:         #d4af37;
            --accent-hover:   #e3c15a;
            --accent-dim:     #8a7228;
            --on-accent:      #14120a;
            --danger:         #e5484d;
            --danger-wash:    rgba(229, 72, 77, 0.12);
            --success:        #3ecf8e;
            --success-wash:   rgba(62, 207, 142, 0.12);
            --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --font-display: "Fraunces", Georgia, serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: var(--bg-canvas);
            color: var(--text-primary);

            font-family: var(--font-sans);

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .login-container {
            width: 100%;
            max-width: 400px;

            padding: 20px;
        }


        .login-box {
            background: var(--bg-surface-2);

            border: 1px solid var(--border);

            border-radius: 16px;

            padding: 34px;

            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
        }


        .logo {
            width: 46px;
            height: 46px;

            margin: 0 auto 18px;

            background: var(--accent);

            color: var(--on-accent);

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 600;
        }


        h1 {
            margin: 0;

            text-align: center;

            font-family: var(--font-display);
            font-size: 19px;
            font-weight: 600;

            letter-spacing: 0.2px;
        }


        .subtitle {
            text-align: center;

            color: var(--text-muted);

            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.6px;
            text-transform: uppercase;

            margin-top: 7px;

            margin-bottom: 30px;
        }


        .form-group {
            margin-bottom: 16px;
        }


        label {
            display: block;

            color: var(--text-secondary);

            font-size: 12px;
            font-weight: 500;

            margin-bottom: 7px;
        }


        input {
            width: 100%;

            height: 42px;

            background: var(--bg-surface-3);

            border: 1px solid var(--border);

            border-radius: 8px;

            color: var(--text-primary);

            padding: 0 13px;

            outline: none;

            font-family: var(--font-sans);
            font-size: 13.5px;

            transition: border-color 0.12s ease;
        }


        input::placeholder {
            color: var(--text-muted);
        }


        input:focus {
            border-color: var(--accent-dim);
        }


        .auth-button {
            width: 100%;

            height: 42px;

            margin-top: 6px;

            border: 1px solid var(--accent);

            border-radius: 8px;

            background: var(--accent);

            color: var(--on-accent);

            font-weight: 600;
            font-size: 13.5px;

            cursor: pointer;

            transition: background 0.12s ease, border-color 0.12s ease;
        }


        .auth-button:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }


        .auth-button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }


        .message {
            display: none;

            padding: 11px 13px;

            margin-bottom: 16px;

            border-radius: 8px;

            font-size: 12.5px;

            line-height: 18px;
        }


        .message.show {
            display: block;
        }


        .message.error {
            background: var(--danger-wash);

            border: 1px solid var(--danger);

            color: #ff9da5;
        }


        .message.success {
            background: var(--success-wash);

            border: 1px solid var(--success);

            color: #77d8a1;
        }


        .footer {
            text-align: center;

            color: var(--text-muted);

            font-size: 10.5px;

            margin-top: 22px;
        }

    </style>

</head>


<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                N
            </div>

            <h1>
                Reset your password
            </h1>

            <div class="subtitle">
                Nietzsche Productions
            </div>


            <div
                id="message"
                class="message"
            ></div>


            <div class="form-group">

                <label for="newPassword">
                    New password
                </label>

                <input
                    id="newPassword"
                    type="password"
                    placeholder="Enter a new password"
                    autocomplete="new-password"
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm new password
                </label>

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Re-enter the new password"
                    autocomplete="new-password"
                >

            </div>


            <button
                id="updatePasswordBtn"
                class="auth-button"
            >
                Update password
            </button>


            <div class="footer">
                Nietzsche AI · Nietzsche Productions
            </div>

        </div>

    </div>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL =
            "https://sotlnkobsnacifwkydok.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_HBtq5d-FoTrVzsAVQ0hBfQ_TTrLxtZb";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        const newPasswordInput =
            document.getElementById("newPassword");

        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const updatePasswordBtn =
            document.getElementById("updatePasswordBtn");

        const message =
            document.getElementById("message");


        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                `message show ${type}`;

        }


        /* =============================================
           The reset-password link Supabase emails out
           carries a recovery token in the URL. supabase-js
           picks this up automatically on page load and
           establishes a temporary "recovery" session, which
           is what lets updateUser() below succeed without
           the person needing to know their old password.
        ============================================= */

        async function updatePassword() {

            const newPassword =
                newPasswordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;


            if (
                !newPassword ||
                !confirmPassword
            ) {

                showMessage(
                    "Fill in both password fields.",
                    "error"
                );

                return;

            }


            if (newPassword.length < 8) {

                showMessage(
                    "Your password must be at least 8 characters.",
                    "error"
                );

                return;

            }


            if (newPassword !== confirmPassword) {

                showMessage(
                    "Those passwords don't match.",
                    "error"
                );

                return;

            }


            updatePasswordBtn.disabled =
                true;

            updatePasswordBtn.textContent =
                "Updating…";


            const {
                error
            } =
                await supabaseClient.auth.updateUser({
                    password:
                        newPassword
                });


            updatePasswordBtn.disabled =
                false;

            updatePasswordBtn.textContent =
                "Update password";


            if (error) {

                showMessage(
                    error.message,
                    "error"
                );

                return;

            }


            showMessage(
                "Password updated. Redirecting to sign in…",
                "success"
            );


            setTimeout(() => {

                window.location.href =
                    "login.html";

            }, 1200);

        }


        updatePasswordBtn.addEventListener(
            "click",
            updatePassword
        );


        confirmPasswordInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    updatePassword();

                }

            }
        );


        /* If someone lands here without a valid recovery
           token (e.g. opened the page directly), there's no
           recovery session, so updateUser() below will fail
           with a clear Supabase error message rather than
           silently doing nothing. */

    </script>

</body>

</html>
